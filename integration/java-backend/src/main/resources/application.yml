spring:
  application:
    name: workbench
  datasource:
    url: jdbc:postgresql://localhost:5432/workbench
    username: ${DB_USERNAME:workbench}
    password: ${DB_PASSWORD:workbench}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

workbench:
  security:
    jwt-secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-32-chars}
    jwt-expiration-ms: 86400000  # 24h

  opencode:
    # opencode 沙箱镜像名
    image: opencode-sandbox:latest
    # 容器内 opencode 服务端口
    container-port: 4096
    # 健康检查超时 (秒)
    health-check-timeout: 30
    # SSE 心跳超时，超过此时间无心跳则重连 (秒)
    sse-heartbeat-timeout: 15
    # LLM API Keys (平台统一管理，注入所有沙箱)
    llm-keys:
      anthropic: ${ANTHROPIC_API_KEY:}
      openai: ${OPENAI_API_KEY:}
      google: ${GOOGLE_GENERATIVE_AI_API_KEY:}
      openrouter: ${OPENROUTER_API_KEY:}

  sandbox:
    # 空闲超时，超过后状态变为 Idle (分钟)
    idle-timeout: 15
    # 挂起超时，空闲后超过此时间挂起容器 (分钟)
    suspend-timeout: 60
    # 过期销毁时间 (天)
    expire-days: 30
    # 容器资源限制
    resources:
      cpu-count: 2
      memory-bytes: 4294967296   # 4GB
      # Docker 挂载宿主机基础路径
    volume-base-path: ${VOLUME_BASE_PATH:/data/sandboxes}

  docker:
    host: ${DOCKER_HOST:unix:///var/run/docker.sock}
    # 沙箱容器所在 Docker 网络 (隔离用)
    network: workbench-sandbox-net

logging:
  level:
    com.platform.workbench: DEBUG
    org.springframework.web.reactive: INFO
